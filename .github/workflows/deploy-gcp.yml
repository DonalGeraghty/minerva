name: Deploy Minerva to Cloud Run

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: minerva-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_ID: donal-geraghty-home
  REGION: europe-west1
  SERVICE_NAME: minerva
  REPOSITORY: minerva
  JANUS_API_URL: ${{ vars.VITE_JANUS_API_URL || 'https://janus-api-schep5xsoq-ew.a.run.app' }}
  CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check frontend
        run: npm run check

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: check
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Authenticate with Google Cloud using Workload Identity Federation
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || 'minerva-github-deployer@donal-geraghty-home.iam.gserviceaccount.com' }}
          project_id: ${{ env.PROJECT_ID }}
      - name: Authenticate with Google Cloud using service-account key
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Verify Google Cloud target
        run: |
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud config get-value project
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push container image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}
        run: |
          docker build --pull \
            --build-arg "VITE_JANUS_API_URL=${JANUS_API_URL}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}
        run: |
          runtime_args=()
          if [[ -n "${CLOUD_RUN_SERVICE_ACCOUNT}" ]]; then
            runtime_args+=(--service-account "${CLOUD_RUN_SERVICE_ACCOUNT}")
          fi
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --port 8080 \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --startup-probe="httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=2,periodSeconds=5,failureThreshold=12" \
            --liveness-probe="httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=5,timeoutSeconds=2,periodSeconds=30,failureThreshold=3" \
            "${runtime_args[@]}" \
            --quiet
      - name: Read and test deployed service
        id: service
        run: |
          url="$(gcloud run services describe "${SERVICE_NAME}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 5 "${url}/health"
      - name: Publish deployment summary
        run: |
          echo "## Minerva deployed" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Service: \`${SERVICE_NAME}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Region: \`${REGION}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Revision image: \`${GITHUB_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- URL: ${{ steps.service.outputs.url }}" >> "${GITHUB_STEP_SUMMARY}"
